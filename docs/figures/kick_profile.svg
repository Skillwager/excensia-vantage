<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What a kick looks like to the tracker</title>
<desc id="desc">Line chart. The share of a strong change in the ball's velocity that falls in each frame around its middle. In the recording and in the simulator as it is now, no frame holds more than about 5% and the curve is 21 frames wide at half its height. In the simulator as first built the middle frame holds 17% and the curve is 5 frames wide.</desc>
<rect width="800" height="450" fill="#ffffff"/>
<text x="24.0" y="36.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start">The recording blurs a kick the way a 21-frame moving average does</text>
<text x="24.0" y="58.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Every strong change in the ball’s velocity (a kick, a deflection, a first touch) is centred on its middle.</text>
<text x="24.0" y="76.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">The curves show the share of the change that falls in each frame, averaged over all of them.</text>
