<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The earlier and the new models on four kinds of recording</title>
<desc id="desc">Dot plot of mean spellF1. The first simulator’s recordings: earlier models 0.701, new models 0.680. The present simulator’s recordings: earlier models 0.652, new models 0.685. A seventh condition, made afterwards: earlier models 0.648, new models 0.688. Another provider’s real tracking: earlier models 0.634, new models 0.658.</desc>
<rect width="800" height="384" fill="#ffffff"/>
<text x="24.0" y="36.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start">Each set of models is ahead at home; on real tracking the new ones are</text>
<text x="24.0" y="58.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Mean spellF1 of the earlier models and of the new ones on four kinds of recording.</text>
<text x="24.0" y="76.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Ten held-out matches under six conditions; one condition for the third row; twenty matches for the fourth.</text>
<circle cx="31.0" cy="101.0" r="6.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="44.0" y="105.5" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Earlier models, trained on the first simulator’s recordings</text>
<circle cx="431.0" cy="101.0" r="6.5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="444.0" y="105.5" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">New models, trained on the present simulator’s</text>
<line x1="318.0" x2="318.0" y1="116" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="318.0" y="342.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0.62</text>
<line x1="402.4" x2="402.4" y1="116" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="402.4" y="342.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0.64</text>
<line x1="486.8" x2="486.8" y1="116" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="486.8" y="342.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0.66</text>
<line x1="571.2" x2="571.2" y1="116" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="571.2" y="342.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0.68</text>
<line x1="655.6" x2="655.6" y1="116" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="655.6" y="342.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0.70</text>
<line x1="740.0" x2="740.0" y1="116" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="740.0" y="342.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0.72</text>
<line x1="318.0" x2="740.0" y1="324" y2="324" stroke="#b9b8ad" stroke-width="1"/>
<text x="529.0" y="362.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle">mean spellF1</text>
<text x="24.0" y="139.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">The first simulator’s recordings</text>
<text x="24.0" y="156.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">where the earlier models were validated</text>
<line x1="571.2" x2="657.7" y1="142" y2="142" stroke="#b9b8ad" stroke-width="2"/>
<circle cx="657.7" cy="142.0" r="6.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="670.7" y="146.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">0.701</text>
<circle cx="571.2" cy="142.0" r="6.5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="558.2" y="146.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end">0.680</text>
<text x="24.0" y="191.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">The present simulator’s recordings</text>
<text x="24.0" y="208.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">where the new models were validated</text>
<line x1="451.4" x2="591.5" y1="194" y2="194" stroke="#b9b8ad" stroke-width="2"/>
<circle cx="451.4" cy="194.0" r="6.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="438.4" y="198.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end">0.652</text>
<circle cx="591.5" cy="194.0" r="6.5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="604.5" y="198.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">0.685</text>
<text x="24.0" y="243.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">A seventh condition, made afterwards</text>
<text x="24.0" y="260.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">the ball untracked about as often as in the recording</text>
<line x1="434.5" x2="602.9" y1="246" y2="246" stroke="#b9b8ad" stroke-width="2"/>
<circle cx="434.5" cy="246.0" r="6.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="421.5" y="250.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end">0.648</text>
<circle cx="602.9" cy="246.0" r="6.5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="615.9" y="250.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">0.688</text>
<text x="24.0" y="295.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Another provider’s real tracking</text>
<text x="24.0" y="312.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">SkillCorner, prepared the same way for both</text>
<line x1="376.7" x2="477.5" y1="298" y2="298" stroke="#b9b8ad" stroke-width="2"/>
<circle cx="376.7" cy="298.0" r="6.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="363.7" y="302.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end">0.634</text>
<circle cx="477.5" cy="298.0" r="6.5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="490.5" y="302.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">0.658</text>
</svg>
